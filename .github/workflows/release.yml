# Build desktop installers and upload them to a GitHub Release.
# See README § "Releases" for how to cut a release.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build for (e.g. v0.1.2). Create the tag on GitHub first."
        required: true
        type: string

concurrency:
  group: tauri-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Require updater signing key
        shell: bash
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for Release builds (signed updater artifacts)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: My POS release
          releaseBody: |
            Desktop installers for **My POS**.

            | Platform | Files |
            | --- | --- |
            | macOS (Apple Silicon) | `.dmg`, `.app.tar.gz` (aarch64) |
            | macOS (Intel) | `.dmg`, `.app.tar.gz` (x86_64) |
            | Windows | NSIS `.exe` setup, WiX `.msi` |
            | Linux | `.deb`, `.AppImage`, `.rpm` |

            In-app updates use `latest.json` on this release (assembled after all platforms finish).
          # Parallel matrix legs must not race on latest.json; a follow-up job writes it once.
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  updater-manifest:
    needs: publish-tauri
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download .sig assets and build latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/updater-sigs
          gh release download "$TAG" --repo "${{ github.repository }}" --dir /tmp/updater-sigs --pattern '*.sig'
          ls -la /tmp/updater-sigs
          node scripts/build-latest-json.mjs \
            --tag="$TAG" \
            --sig-dir=/tmp/updater-sigs \
            --out=/tmp/latest.json \
            --repo="${{ github.repository }}" \
            --notes="My POS $TAG"
          cat /tmp/latest.json

      - name: Upload latest.json to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Replace any existing latest.json from a partial earlier run.
          if gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name' | grep -qx 'latest.json'; then
            gh release delete-asset "$TAG" latest.json --repo "${{ github.repository }}" --yes
          fi
          gh release upload "$TAG" /tmp/latest.json --repo "${{ github.repository }}" --clobber
